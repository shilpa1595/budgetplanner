<div class="income-page">
  <div class="page-header">
    <a routerLink="/income/income-list" class="back-btn" title="Back">
      <i class="fas fa-arrow-left"></i>
    </a>
    <div class="page-header__icon page-header__icon--edit">
      <i class="fas fa-pen"></i>
    </div>
    <div>
      <h1 class="page-header__title">Edit Income</h1>
      <p class="page-header__sub">Update your income record</p>
    </div>
  </div>

  <div class="form-card">
    <div class="form-card__illustration">
      <div class="illustration-bg">
        <img src="assets/images/add-income.png" alt="Edit income" class="illustration-img" />
      </div>
      <div class="illustration-stats">
        <div class="stat-chip">
          <i class="fas fa-pen-to-square"></i>
          <span>Update record</span>
        </div>
      </div>
    </div>

    <div class="form-card__body">
      <form [formGroup]="updateIncomeForm" (ngSubmit)="updateIncome()" class="income-form">

        <!-- Amount -->
        <div class="field-group">
          <label class="field-label">
            <i class="fas fa-indian-rupee-sign label-icon"></i>
            Amount
          </label>
          <div class="input-wrapper">
            <span class="input-prefix">₹</span>
            <input
              class="field-input"
              type="text"
              placeholder="e.g. 10,000"
              formControlName="amount"
              [class.error]="updateIncomeForm.get('amount')?.invalid && updateIncomeForm.get('amount')?.touched"
            />
          </div>
          <span class="field-error" *ngIf="updateIncomeForm.get('amount')?.invalid && updateIncomeForm.get('amount')?.touched">
            Amount is required
          </span>
        </div>

        <!-- Category -->
        <div class="field-group">
          <label class="field-label">
            <i class="fas fa-tags label-icon"></i>
            Category
          </label>
          <div class="input-wrapper select-wrapper">
            <select
              class="field-input field-select"
              formControlName="category"
              [class.error]="updateIncomeForm.get('category')?.invalid && updateIncomeForm.get('category')?.touched"
            >
              <option value="" disabled>Select a category...</option>
              <option>Salary</option>
              <option>Business Income</option>
              <option>Investment Returns</option>
              <option>Rental Income</option>
              <option>Freelance Income</option>
              <option>Other Income</option>
            </select>
            <i class="fas fa-chevron-down select-arrow"></i>
          </div>
          <span class="field-error" *ngIf="updateIncomeForm.get('category')?.invalid && updateIncomeForm.get('category')?.touched">
            Category is required
          </span>
        </div>

        <!-- Date -->
        <div class="field-group">
          <label class="field-label">
            <i class="fas fa-calendar label-icon"></i>
            Date of Income
          </label>
          <div class="input-wrapper">
            <input
              type="date"
              class="field-input"
              formControlName="dateOfIncome"
              [class.error]="updateIncomeForm.get('dateOfIncome')?.invalid && updateIncomeForm.get('dateOfIncome')?.touched"
            />
          </div>
          <span class="field-error" *ngIf="updateIncomeForm.get('dateOfIncome')?.invalid && updateIncomeForm.get('dateOfIncome')?.touched">
            Date is required
          </span>
        </div>

        <!-- Actions -->
        <div class="form-actions">
          <a routerLink="/income/income-list" class="cancel-btn">
            <i class="fas fa-times me-2"></i>Cancel
          </a>
          <button
            class="submit-btn"
            type="submit"
            [disabled]="updateIncomeForm.invalid"
          >
            <span class="submit-btn__text">
              <i class="fas fa-check-circle me-2"></i>Update Income
            </span>
            <span class="submit-btn__ripple"></span>
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
