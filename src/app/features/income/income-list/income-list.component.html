<section class="incomeList">
  <div class="container py-5 px-0">
    <div class="row">
      <div class="col-md-12">
        <div class="card-style mb-4">
          <div class="header-section">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h2>Income List</h2>
                <p>Track and manage your income sources</p>
              </div>
              <div class="total-income">
                <i class="fas fa-wallet me-2"></i>Total: ₹{{ totalIncome }}
              </div>
            </div>
          </div>

          <div class="filter-section mx-4">
            <div class="row align-items-end">
              <div class="col-md-4">
                <label><i class="fas fa-calendar-alt me-2"></i>Select Month</label>
                <input type="month" class="month-filter-input" [(ngModel)]="selectedMonth" (change)="filterByMonth()" />
              </div>
              <div class="col-md-8">
                <div class="d-flex justify-content-md-end mt-3 mt-md-0">
                  <a routerLink="/income/add-income" class="btn btn-primary">
                    <i class="fas fa-plus-circle me-2"></i>Add Income
                  </a>
                </div>
              </div>
            </div>
          </div>

          <div class="table-container mx-4 mb-4">
            <div class="table-header d-flex justify-content-between align-items-center">
              <h3><i class="fas fa-list me-2"></i>Income Records</h3>
            </div>
            <div class="table-responsive">
              <table class="table income-table">
                <thead>
                  <tr>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngIf="filteredIncomes.length === 0">
                    <td colspan="4" class="text-center text-danger fw-bold">
                      No data available for the selected month
                    </td>
                  </tr>
                  <tr *ngFor="let income of filteredIncomes">
                    <td class="amount-cell">{{ income.amount }}</td>
                    <td class="category-cell">{{ income.category }}</td>
                    <td class="date-cell">{{ income.dateOfIncome }}</td>
                    <td class="actions-cell">
                      <button (click)="deleteIncome(income.id)" class="btn-action btn-delete me-2" title="Delete">
                        <i class="fas fa-trash"></i>
                      </button>
                      <button [routerLink]="['/income/edit-income', income.id]" class="btn-action btn-edit" title="Edit">
                        <i class="fas fa-edit"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
