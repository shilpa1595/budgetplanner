<div class="reports-page">

  <!-- ── Page header ──────────────────────────────────────────── -->
  <div class="page-header">
    <div class="page-header__icon">
      <i class="fas fa-chart-bar"></i>
    </div>
    <div class="page-header__text">
      <h1 class="page-header__title">{{ 'REPORTS.PAGE_TITLE' | translate }}</h1>
      <p class="page-header__sub">{{ 'REPORTS.PAGE_SUB' | translate }}</p>
    </div>
  </div>

  <!-- ── Segmented pill control ───────────────────────────────── -->
  <div class="seg-wrap">
    <div class="seg-track">
      <button
        class="seg-btn"
        [class.seg-btn--active]="!isIncomeSelected"
        (click)="isIncomeSelected = false"
        type="button"
      >
        <i class="fas fa-arrow-trend-down"></i>
        {{ 'REPORTS.EXPENSES' | translate }}
      </button>
      <button
        class="seg-btn"
        [class.seg-btn--active]="isIncomeSelected"
        (click)="isIncomeSelected = true"
        type="button"
      >
        <i class="fas fa-arrow-trend-up"></i>
        {{ 'REPORTS.INCOME' | translate }}
      </button>
      <div
        class="seg-pill"
        [class.seg-pill--income]="isIncomeSelected"
      ></div>
    </div>
  </div>

  <!-- ── View container ───────────────────────────────────────── -->
  <div class="reports-view">
    <app-expense-list *ngIf="!isIncomeSelected"></app-expense-list>
    <app-income-list  *ngIf="isIncomeSelected"></app-income-list>
  </div>

</div>
