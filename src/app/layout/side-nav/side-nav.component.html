<!-- Hamburger toggle -->
<div class="toggle-btn" (click)="toggle()">
  <mat-icon>{{ isCollapsed ? 'menu' : 'close' }}</mat-icon>
</div>

<!-- Backdrop -->
<div class="backdrop" *ngIf="!isCollapsed" (click)="toggle()"></div>

<!-- Side panel -->
<aside class="side-panel" [class.collapsed]="isCollapsed">
  <div class="brand">
    <img src="assets/images/FinTrack.png" alt="FinTrack" class="brand-logo">
  </div>

  <nav class="nav-list">
    <a
      *ngFor="let item of navItems"
      class="nav-item"
      [routerLink]="item.route"
      routerLinkActive="active"
      (click)="toggle()">
      <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </nav>

  <div class="side-footer">
    <button class="logout-btn" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </div>
</aside>
