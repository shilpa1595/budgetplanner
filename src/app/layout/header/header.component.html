<header class="app-header">
  <div class="header-left">
    <!-- Hamburger — visible on mobile only -->
    <button class="hamburger" (click)="layout.toggle()" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Logo (mobile only — desktop shows it in sidenav) -->
    <div class="mobile-brand">
      <img src="assets/images/FinTrack.png" alt="FinTrack" class="mobile-logo" />
    </div>
  </div>

  <div class="header-right">
    <!-- Language switcher -->
    <div class="lang-switcher dropdown">
      <button class="lang-btn dropdown-toggle" type="button"
        data-bs-toggle="dropdown" aria-expanded="false">
        <i class="fa-solid fa-globe"></i>
        <span>{{ currentLang | uppercase }}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li>
          <button class="dropdown-item" (click)="switchLanguage('en')">
            <span class="flag">🇬🇧</span> English
          </button>
        </li>
        <li>
          <button class="dropdown-item" (click)="switchLanguage('mr')">
            <span class="flag">🇮🇳</span> मराठी
          </button>
        </li>
      </ul>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- User info -->
    <div class="user-info dropdown">
      <button class="user-btn dropdown-toggle" type="button"
        data-bs-toggle="dropdown" aria-expanded="false">
        <div class="avatar">{{ userInitial }}</div>
        <span class="user-email">{{ userEmail }}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li class="dropdown-header">
          <div class="avatar avatar-lg">{{ userInitial }}</div>
          <small class="text-muted mt-1">{{ userEmail }}</small>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <button class="dropdown-item text-danger" (click)="logout()">
            <i class="fa-solid fa-right-from-bracket me-2"></i> Logout
          </button>
        </li>
      </ul>
    </div>
  </div>
</header>
