<div class="cd-backdrop" *ngIf="visible" (click)="onCancel()"></div>

<div class="cd-panel" *ngIf="visible" role="dialog" aria-modal="true" [attr.aria-label]="title">
  <div class="cd-icon" [class.danger]="danger">
    <span>{{ danger ? '🗑️' : '❓' }}</span>
  </div>

  <h3 class="cd-title">{{ title }}</h3>
  <p class="cd-message">{{ message }}</p>

  <div class="cd-actions">
    <button class="btn-cancel" (click)="onCancel()">{{ cancelLabel }}</button>
    <button class="btn-confirm" [class.danger]="danger" (click)="onConfirm()">
      {{ confirmLabel }}
    </button>
  </div>
</div>
